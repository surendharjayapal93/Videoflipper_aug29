[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "LOG", "RUF"]
ignore = [
    "B008",  # FastAPI's `Depends(...)` idiom requires function calls in argument defaults
    "UP042", # keep `class X(str, enum.Enum)` — SQLAlchemy's `Enum` type is tested against this pattern
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
# Ensures `import app...` resolves when pytest is run from `backend/`,
# regardless of import-mode / rootdir auto-detection quirks.
pythonpath = ["."]
testpaths = ["tests"]
